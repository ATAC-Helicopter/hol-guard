name: InstaPods policy closure

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-policy-closure.yml

permissions:
  contents: read

jobs:
  diagnose-grant-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: '0.8.15'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Add local block regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_guard_mcp_server_grants.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_evaluate_write_file_blocks_after_local_enable(tmp_path: Path, monkeypatch: pytest.MonkeyPatch) -> None:\n'
          test = '''def test_custom_mcp_block_overrides_base_allow(tmp_path: Path) -> None:\n    identity = _identity()\n    store = GuardStore(tmp_path / "guard-home")\n    cli_identity = UnlistedCliIdentity(\n        cli_id=f"local-cli.mcp-{identity.identity_hash[:8]}",\n        name=identity.package_name or "mcp-server",\n        kind="executable",\n        identity_hash=identity.identity_hash,\n        example_label="npx -y @modelcontextprotocol/server-filesystem",\n    )\n    store.record_local_cli_observation(\n        cli_identity,\n        seen_at=utc_now(),\n        surface="mcp",\n        server_identity_hash=identity.identity_hash,\n        server_command=identity.command,\n        server_args_hash=identity.args_hash,\n        help_status="ok",\n    )\n    store.replace_local_cli_commands(\n        cli_identity.cli_id,\n        (LocalCliCommand("write_file", "write_file", "write_file", "Write a file"),),\n    )\n    store.upsert_local_cli_grant(\n        identity=cli_identity,\n        state="allowed",\n        expected_revision=0,\n        updated_at=utc_now(),\n        command_states={"write_file": "block"},\n    )\n    artifact = _artifact(identity, "write_file")\n    granted = apply_local_mcp_extension_decision(store, artifact, "allow")\n    assert granted is not None\n    assert granted[0] == "block"\n    assert granted[1] == "local-mcp-extension"\n\n\n'''
          if 'def test_custom_mcp_block_overrides_base_allow' not in text:
              if marker not in text:
                  raise SystemExit('missing grant test anchor')
              text = text.replace(marker, test + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
          uv run ruff check --fix tests/test_guard_mcp_server_grants.py
          uv run ruff format tests/test_guard_mcp_server_grants.py
      - name: Test local block over base allow
        run: uv run pytest -q tests/test_guard_mcp_server_grants.py::test_custom_mcp_block_overrides_base_allow
      - name: Test existing MCP grant suite
        run: uv run pytest -q tests/test_guard_mcp_server_grants.py -k 'not custom_mcp_block_overrides_base_allow'
