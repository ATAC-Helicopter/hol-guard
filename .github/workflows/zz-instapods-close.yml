name: InstaPods closure checks

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-close.yml

permissions:
  contents: read

jobs:
  close:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.26
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.13
      - name: Apply hosted MCP source fixes
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/zz-instapods-regenerate.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('source patch block not found')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'instapods-source-fixes.py', 'exec'))
          EXTRACT
      - name: Apply repository lint and format fixes
        run: |
          uv run --no-sync ruff check --fix \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_resolution.py \
            tests/test_guard_remote_mcp_contributions.py
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            tests/test_guard_remote_mcp_contributions.py
      - name: Export extension directory
        run: uv run --no-sync python scripts/export_extension_directory.py
      - name: Render extension documentation
        run: uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Regenerate command decision evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Test hosted MCP contribution
        run: uv run --no-sync pytest -q tests/test_guard_remote_mcp_contributions.py
      - name: Test MCP contribution contracts
        run: uv run --no-sync pytest -q tests/test_guard_mcp_server_contribution.py tests/test_guard_extension_trust.py tests/test_guard_extension_directory_export.py
      - name: Ruff check hosted MCP files
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_resolution.py \
            tests/test_guard_remote_mcp_contributions.py
      - name: Ruff format hosted MCP files
        run: |
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            tests/test_guard_remote_mcp_contributions.py
      - name: Commit verified source and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_resolution.py \
            tests/test_guard_remote_mcp_contributions.py \
            dashboard/src/extension-controls-api.ts \
            dashboard/src/extension-controls-normalize.ts \
            dashboard/src/extension-controls-normalize.test.ts \
            dashboard/src/protection-center/mcp-server-defaults.tsx \
            dashboard/src/protection-center/protection-module-detail.test.tsx \
            docs/guard/extensions/catalog.v1.json \
            docs/guard/extensions/README.md \
            tests/fixtures/guard-command-corpus/decision-diff-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix hosted MCP runtime and generated catalog'
          git push origin HEAD:codex/instapods-remote-mcp-extension
