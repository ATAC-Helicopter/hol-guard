name: Temporary decision-diff refresh

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"

      - name: Refresh source-bound evidence
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          rm .github/workflows/_tmp_refresh_decision_diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json .github/workflows/_tmp_refresh_decision_diff.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh decision-diff source binding"
          git push origin HEAD:codex/instapods-remote-mcp-extension
