name: Regenerate decision evidence

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension

permissions:
  contents: write

concurrency:
  group: regenerate-decision-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Regenerate and verify exact evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          git diff --exit-code -- . ':!tests/fixtures/guard-command-corpus/decision-diff-report.json' || {
            echo "generator changed an unexpected file"
            exit 1
          }

      - name: Commit generated evidence when changed
        run: |
          if git diff --quiet -- tests/fixtures/guard-command-corpus/decision-diff-report.json; then
            echo "Decision evidence is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git commit -m "Regenerate decision evidence"
          git push origin HEAD:codex/instapods-remote-mcp-extension
