# Triggered to apply the branch-local hosted MCP fix and remove this helper.
name: Temporary InstaPods host normalization fix

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/tmp-instapods-host-dot-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/instapods-remote-mcp-extension

      - uses: astral-sh/setup-uv@v6

      - name: Reject malformed multi-dot DNS root hosts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py")
          text = source.read_text()
          old_line = '    host = parsed.hostname.lower().rstrip(".")\n'
          replacement = (
              '    raw_host = parsed.hostname.lower()\n'
              '    if raw_host.endswith(".."):\n'
              '        return None\n'
              '    host = raw_host[:-1] if raw_host.endswith(".") else raw_host\n'
          )
          if old_line not in text:
              raise SystemExit("host normalization line not found")
          source.write_text(text.replace(old_line, replacement, 1))

          tests = Path("tests/test_guard_remote_mcp_contributions.py")
          text = tests.read_text()
          test_name = "test_remote_http_url_contract_rejects_multiple_trailing_root_dots"
          if test_name not in text:
              addition = '''\n\ndef test_remote_http_url_contract_rejects_multiple_trailing_root_dots() -> None:\n    url = "https://app.instapods.com../api/mcp"\n    with pytest.raises(ValueError, match=r"schema|public HTTPS endpoint"):\n        validate_mcp_contribution(_remote_payload(url))\n    assert normalized_remote_mcp_url(url) is None\n'''
              tests.write_text(text.rstrip() + addition + "\n")
          PY

          uv sync --frozen --group dev
          uv run ruff format src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py tests/test_guard_remote_mcp_contributions.py
          uv run ruff check src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py tests/test_guard_remote_mcp_contributions.py
          uv run ruff format --check src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py tests/test_guard_remote_mcp_contributions.py
          uv run pytest -q tests/test_guard_remote_mcp_contributions.py
          uv run python tests/guard_command_decision_diff.py --write
          uv run python tests/guard_command_decision_diff.py --check

          rm .github/workflows/tmp-instapods-host-dot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject malformed hosted MCP host roots"
          git push origin HEAD:codex/instapods-remote-mcp-extension
