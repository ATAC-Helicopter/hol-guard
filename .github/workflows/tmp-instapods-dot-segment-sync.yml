name: Temporary InstaPods dot segment sync

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/tmp-instapods-dot-segment-sync.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: codex/instapods-remote-mcp-extension
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Sync main and repair hosted endpoint identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kantorcodes"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "tests/fixtures/guard-command-corpus/decision-diff-report.json" ]; then
              printf 'Unexpected merge conflicts:\n'
              printf '%s\n' "${conflicts[@]}"
              exit 1
            fi
            git checkout --ours tests/fixtures/guard-command-corpus/decision-diff-report.json
            git add tests/fixtures/guard-command-corpus/decision-diff-report.json
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain"
              exit 1
            fi
          fi

          python - <<'PY'
          from pathlib import Path

          source = Path("src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py")
          text = source.read_text(encoding="utf-8")
          old = '''def _normalized_remote_path(path: str) -> str | None:\n    return _normalized_remote_component(path, allowed_chars=_REMOTE_PATH_CHARS, empty_default="/")\n'''
          new = '''def _remove_remote_dot_segments(path: str) -> str:\n    segments = path.split("/")\n    resolved: list[str] = []\n    for segment in segments:\n        if segment == "..":\n            if resolved:\n                resolved.pop()\n        elif segment != ".":\n            resolved.append(segment)\n    if segments[-1] in {".", ".."}:\n        resolved.append("")\n    normalized = "/".join(resolved) or "/"\n    if path.startswith("/") and not normalized.startswith("/"):\n        normalized = f"/{normalized}"\n    return normalized\n\n\ndef _normalized_remote_path(path: str) -> str | None:\n    normalized = _normalized_remote_component(path, allowed_chars=_REMOTE_PATH_CHARS, empty_default="/")\n    if normalized is None:\n        return None\n    return _remove_remote_dot_segments(normalized)\n'''
          if old not in text:
              raise SystemExit("remote path normalization target not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_guard_remote_mcp_endpoint_contract.py")
          test_text = tests.read_text(encoding="utf-8")
          anchor = '''def test_remote_path_percent_escapes_have_one_endpoint_identity() -> None:\n'''
          addition = '''def test_remote_path_dot_segments_have_one_endpoint_identity() -> None:\n    expected = "https://example.test/api/mcp"\n    variants = (\n        "https://example.test/api/./mcp",\n        "https://example.test/api/%2e/mcp",\n        "https://example.test/api/route/../mcp",\n        "https://example.test/api/route/%2E%2E/mcp",\n    )\n\n    for variant in variants:\n        assert normalized_remote_mcp_url(variant) == expected\n        assert remote_mcp_endpoint_identity(variant) == expected\n\n\ndef test_remote_runtime_matches_equivalent_dot_segment_route() -> None:\n    identity = build_mcp_server_identity(\n        config_path=".mcp.json",\n        command="https://example.test/api/route/../mcp",\n        args=(),\n        transport="http",\n    )\n    artifact = build_tool_call_artifact(\n        harness="codex",\n        server_name="example",\n        tool_name="write_data",\n        source_scope="project",\n        config_path=".mcp.json",\n        transport="http",\n        server_identity=identity,\n    )\n    launch = {\n        "kind": "remote-http",\n        "url": "https://example.test/api/mcp",\n        "serverNames": ["example"],\n    }\n\n    assert _matches_remote_http_contribution(artifact, launch)\n\n\n'''
          if addition not in test_text:
              if anchor not in test_text:
                  raise SystemExit("endpoint contract test anchor not found")
              tests.write_text(test_text.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY

          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            tests/test_guard_remote_mcp_endpoint_contract.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            tests/test_guard_remote_mcp_endpoint_contract.py
          uv run --no-sync pytest -q \
            tests/test_guard_remote_mcp_endpoint_contract.py \
            tests/test_guard_remote_mcp_contributions.py \
            tests/test_guard_mcp_server_grants.py

          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check

          git add src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
          git add tests/test_guard_remote_mcp_endpoint_contract.py
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git rm .github/workflows/tmp-instapods-dot-segment-sync.yml
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize hosted MCP dot segment paths"
          git push origin HEAD:codex/instapods-remote-mcp-extension
