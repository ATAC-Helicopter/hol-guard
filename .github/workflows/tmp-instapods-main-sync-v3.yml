name: Temporary InstaPods safe main sync

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/tmp-instapods-main-sync-v3.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/instapods-remote-mcp-extension

      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2

      - name: Merge current main, regenerate artifacts, validate, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          trigger_sha="${GITHUB_SHA}"
          git fetch origin main codex/instapods-remote-mcp-extension

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            [ -n "$conflicts" ] || { echo "merge failed without conflict paths"; exit 1; }
            while IFS= read -r path; do
              case "$path" in
                src/codex_plugin_scanner/guard/daemon/static/assets/chunks/extensions-workspace.js|tests/fixtures/guard-command-corpus/decision-diff-report.json)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "unexpected merge conflict: $path"
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "unresolved merge conflicts remain"
              exit 1
            fi
          fi

          uv sync --frozen --group dev
          uv run python scripts/export_extension_directory.py
          uv run python scripts/render_command_extension_directory.py

          uv run python - <<'PY'
          import json
          import re
          from pathlib import Path

          from codex_plugin_scanner.guard.managed_controls_policy_bundle import (
              signed_cloud_extension_projection_digest,
              signed_cloud_extension_projection_json,
          )
          from codex_plugin_scanner.guard.runtime import runner
          from tests.managed_controls_activation_support import parse_managed_bundle
          from tests.test_guard_extension_control_catalog_detail import _identity_snapshot

          baseline_path = Path("tests/fixtures/extension-controls/catalog-baseline.v1.json")
          baseline = json.loads(baseline_path.read_text())
          baseline.update(_identity_snapshot())
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")

          vector_path = Path("contracts/managed-controls/v1/extension-projection-digest-vector.json")
          vector = json.loads(vector_path.read_text())
          source_path = vector_path.with_name("policy-bundle-v2-extension-signature-vector.json")
          bundle = json.loads(source_path.read_text())["bundle"]
          catalog_digest = runner.build_builtin_extension_catalog_wire(
              guard_version="test",
              generated_at="2026-08-25T12:00:00Z",
          )["catalogDigest"]
          parsed = parse_managed_bundle(bundle)
          canonical = signed_cloud_extension_projection_json(parsed, catalog_digest=catalog_digest)
          projection_digest = signed_cloud_extension_projection_digest(parsed, catalog_digest=catalog_digest)
          vector["catalogDigest"] = catalog_digest
          vector["canonicalProjectionJson"] = canonical
          vector["expectedExtensionProjectionDigest"] = projection_digest
          vector_path.write_text(json.dumps(vector, indent=2) + "\n")

          test_path = Path("tests/test_policy_bundle_delivery_runtime.py")
          test_text = test_path.read_text()
          test_text = re.sub(
              r'_GUARD_RELEASE_CATALOG_DIGEST = "[0-9a-f]+"',
              f'_GUARD_RELEASE_CATALOG_DIGEST = "{catalog_digest}"',
              test_text,
              count=1,
          )
          test_text = re.sub(
              r'_GUARD_RELEASE_PROJECTION_DIGEST = "sha256:[0-9a-f]+"',
              f'_GUARD_RELEASE_PROJECTION_DIGEST = "{projection_digest}"',
              test_text,
              count=1,
          )
          test_path.write_text(test_text)
          PY

          uv run python tests/guard_command_decision_diff.py --write

          cd dashboard
          bun install --frozen-lockfile
          bun run build
          cd ..

          uv run python scripts/export_extension_directory.py --check
          uv run python scripts/render_command_extension_directory.py --check
          uv run python tests/guard_command_decision_diff.py --check
          uv run pytest -q \
            tests/test_guard_remote_mcp_contributions.py \
            tests/test_guard_remote_mcp_endpoint_contract.py \
            tests/test_guard_remote_mcp_endpoint_length.py \
            tests/test_guard_remote_mcp_host_roots.py \
            tests/test_guard_remote_mcp_server_name_fallback.py \
            tests/test_guard_remote_mcp_url_safety.py \
            tests/test_guard_mcp_server_grants.py \
            tests/test_guard_extension_trust.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_policy_bundle_delivery_runtime.py
          (cd dashboard && bun src/extension-controls-normalize.test.ts && bun src/protection-center/protection-module-detail.test.tsx)

          rm .github/workflows/tmp-instapods-main-sync-v3.yml
          git add -A
          git diff --cached --check

          git fetch origin codex/instapods-remote-mcp-extension
          remote_sha="$(git rev-parse origin/codex/instapods-remote-mcp-extension)"
          if [ "$remote_sha" != "$trigger_sha" ]; then
            echo "branch advanced during sync: expected $trigger_sha, found $remote_sha"
            exit 1
          fi

          git commit -m "chore: sync InstaPods branch with current main"
          git push origin HEAD:codex/instapods-remote-mcp-extension
