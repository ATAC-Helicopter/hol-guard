name: InstaPods dashboard asset regeneration

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-static-regenerate.yml
      - dashboard/**

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: cd dashboard && bun install --frozen-lockfile && bun run build
      - name: Commit generated dashboard assets
        shell: bash
        run: |
          git add src/codex_plugin_scanner/guard/daemon/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh dashboard assets'
          git push origin HEAD:codex/instapods-remote-mcp-extension
