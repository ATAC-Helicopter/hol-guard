name: InstaPods decision evidence regeneration

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-decision-evidence.yml
      - src/codex_plugin_scanner/guard/runtime/mcp_server_catalog.py
      - src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
      - tests/test_guard_remote_mcp_endpoint_contract.py

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Verify generator changed only the fixture
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^tests/fixtures/guard-command-corpus/decision-diff-report.json$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected generator changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit exact generated fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/guard-command-corpus/decision-diff-report.json
          if git diff --quiet -- "$fixture"; then
            echo "decision evidence already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$fixture"
          git commit -m "Refresh decision evidence"
          git push origin HEAD:codex/instapods-remote-mcp-extension
