name: InstaPods decision evidence regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zz-instapods-decision-evidence.yml
      - src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
      - tests/fixtures/guard-command-corpus/decision-diff-report.json

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'kantorcodes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain | grep -v ' tests/fixtures/guard-command-corpus/decision-diff-report.json$' || true)
          test -z "$unexpected"
      - name: Commit generated decision evidence
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/guard-command-corpus/decision-diff-report.json
          git add -- "$fixture"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit -m "chore: refresh decision evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
