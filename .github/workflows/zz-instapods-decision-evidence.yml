name: InstaPods decision evidence closure

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-decision-evidence.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate and verify source-bound decision evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          git diff --exit-code -- tests/guard_command_decision_diff.py
      - name: Commit generated evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-instapods-decision-evidence.yml
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(.github/workflows/zz-instapods-decision-evidence.yml|tests/fixtures/guard-command-corpus/decision-diff-report.json)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate source-bound decision evidence"
          git push origin HEAD:codex/instapods-remote-mcp-extension
