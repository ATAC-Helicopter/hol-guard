name: InstaPods decision evidence regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zz-instapods-decision-evidence.yml
      - src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
      - tests/fixtures/guard-command-corpus/decision-diff-report.json

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instapods-decision-diff-report
          path: tests/fixtures/guard-command-corpus/decision-diff-report.json
          if-no-files-found: error
