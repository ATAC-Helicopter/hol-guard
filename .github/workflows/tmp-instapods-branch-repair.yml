name: InstaPods branch repair

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Repair deterministic branch artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('src/codex_plugin_scanner/guard/cli/commands_support_runtime_resolution.py'),
              Path('src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py'),
          )
          for path in paths:
              data = path.read_bytes()
              if not data.endswith(b'\n'):
                  path.write_bytes(data + b'\n')
          PY
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python -m ruff check \
            src/ \
            tests/test_guard_durable_io.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
          rm .github/workflows/tmp-instapods-branch-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_resolution.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py \
            tests/guard_command_decision_diff.py \
            decision-diff-report.json \
            .github/workflows/tmp-instapods-branch-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix deterministic branch CI artifacts'
          git push origin HEAD:codex/instapods-remote-mcp-extension
