name: Temporary InstaPods decision fixture repair

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/tmp-instapods-decision-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Regenerate and verify decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py tests/test_guard_remote_mcp_ipv4_mapped.py
          uv run --no-sync pytest tests/test_guard_remote_mcp_ipv4_mapped.py --tb=short

      - name: Commit regenerated fixture and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git rm .github/workflows/tmp-instapods-decision-fixture-repair.yml
          git diff --cached --quiet && { echo "Expected decision fixture change was not produced"; exit 1; }
          git commit -m "Regenerate decision evidence after MCP normalization"
          git push origin HEAD:codex/instapods-remote-mcp-extension
