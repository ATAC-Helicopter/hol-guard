name: Temporary InstaPods main sync

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/tmp-instapods-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/instapods-remote-mcp-extension

      - uses: astral-sh/setup-uv@v6

      - name: Merge current main and regenerate source-bound artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def main_text(path: str) -> str:
              return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          # Both branches add external extension IDs in the same JSON array.
          path = Path("contracts/extensions/trust-class-map.v1.json")
          ours = json.loads(path.read_text())
          theirs = json.loads(main_text(path.as_posix()))
          for key, value in theirs.items():
              if isinstance(value, dict) and isinstance(ours.get(key), dict):
                  for subkey, subvalue in value.items():
                      if isinstance(subvalue, list) and isinstance(ours[key].get(subkey), list):
                          ours[key][subkey] = list(dict.fromkeys([*ours[key][subkey], *subvalue]))
                      elif subkey not in ours[key]:
                          ours[key][subkey] = subvalue
              elif key not in ours:
                  ours[key] = value
          path.write_text(json.dumps(ours, indent=2) + "\n")

          # Preserve main's Ollama package staging alongside InstaPods MCP staging.
          for filename, needle, anchor in (
              (
                  "pyproject.toml",
                  '"contributions/extensions/command.ollama.json" = "codex_plugin_scanner/guard/contracts/data/extensions/contributions/command.ollama.json"',
                  '"contributions/extensions/command.noodle.json" = "codex_plugin_scanner/guard/contracts/data/extensions/contributions/command.noodle.json"',
              ),
              (
                  "scripts/release/stage_guard_cloud_review_artifacts.py",
                  '    "contributions/extensions/command.ollama.json": "extensions/contributions/command.ollama.json",',
                  '    "contributions/extensions/command.noodle.json": "extensions/contributions/command.noodle.json",',
              ),
          ):
              p = Path(filename)
              text = p.read_text()
              if needle not in text:
                  if anchor not in text:
                      raise SystemExit(f"missing insertion anchor in {filename}")
                  text = text.replace(anchor, anchor + "\n" + needle, 1)
                  p.write_text(text)

          # The trust test has branch-local InstaPods coverage and main-local Ollama coverage.
          p = Path("tests/test_guard_extension_trust.py")
          text = p.read_text()
          if '        "command.ollama",' not in text:
              anchor = '        "command.noodle",'
              if anchor not in text:
                  raise SystemExit("missing trust-test insertion anchor")
              text = text.replace(anchor, anchor + '\n        "command.ollama",', 1)
              p.write_text(text)
          PY

          uv sync --frozen --group dev
          uv run python scripts/export_extension_directory.py
          uv run python scripts/render_command_extension_directory.py

          uv run python - <<'PY'
          import json
          import re
          from pathlib import Path

          from codex_plugin_scanner.guard.managed_controls_policy_bundle import (
              signed_cloud_extension_projection_digest,
              signed_cloud_extension_projection_json,
          )
          from codex_plugin_scanner.guard.runtime import runner
          from tests.managed_controls_activation_support import parse_managed_bundle
          from tests.test_guard_extension_control_catalog_detail import _identity_snapshot

          baseline_path = Path("tests/fixtures/extension-controls/catalog-baseline.v1.json")
          baseline = json.loads(baseline_path.read_text())
          baseline.update(_identity_snapshot())
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")

          vector_path = Path("contracts/managed-controls/v1/extension-projection-digest-vector.json")
          vector = json.loads(vector_path.read_text())
          source_path = vector_path.with_name("policy-bundle-v2-extension-signature-vector.json")
          bundle = json.loads(source_path.read_text())["bundle"]
          catalog_digest = runner.build_builtin_extension_catalog_wire(
              guard_version="test",
              generated_at="2026-08-25T12:00:00Z",
          )["catalogDigest"]
          parsed = parse_managed_bundle(bundle)
          canonical = signed_cloud_extension_projection_json(parsed, catalog_digest=catalog_digest)
          projection_digest = signed_cloud_extension_projection_digest(parsed, catalog_digest=catalog_digest)
          vector["catalogDigest"] = catalog_digest
          vector["canonicalProjectionJson"] = canonical
          vector["expectedExtensionProjectionDigest"] = projection_digest
          vector_path.write_text(json.dumps(vector, indent=2) + "\n")

          test_path = Path("tests/test_policy_bundle_delivery_runtime.py")
          test_text = test_path.read_text()
          test_text = re.sub(
              r'_GUARD_RELEASE_CATALOG_DIGEST = "[0-9a-f]+"',
              f'_GUARD_RELEASE_CATALOG_DIGEST = "{catalog_digest}"',
              test_text,
              count=1,
          )
          test_text = re.sub(
              r'_GUARD_RELEASE_PROJECTION_DIGEST = "sha256:[0-9a-f]+"',
              f'_GUARD_RELEASE_PROJECTION_DIGEST = "{projection_digest}"',
              test_text,
              count=1,
          )
          test_path.write_text(test_text)
          PY

          uv run python tests/guard_command_decision_diff.py --write

          uv run python scripts/export_extension_directory.py --check
          uv run python scripts/render_command_extension_directory.py --check
          uv run python tests/guard_command_decision_diff.py --check
          uv run pytest -q \
            tests/test_guard_extension_trust.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_policy_bundle_delivery_runtime.py \
            tests/test_guard_command_ollama_extensions.py

          rm .github/workflows/tmp-instapods-main-sync.yml
          git add -A
          git commit -m "chore: sync InstaPods branch with current main"
          git push origin HEAD:codex/instapods-remote-mcp-extension
