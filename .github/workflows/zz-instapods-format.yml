name: InstaPods format closure

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync python -m ruff format src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-instapods-format.yml
          git add src/codex_plugin_scanner/guard/runtime/mcp_server_contribution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format hosted MCP contribution module"
          git push origin HEAD:codex/instapods-remote-mcp-extension
