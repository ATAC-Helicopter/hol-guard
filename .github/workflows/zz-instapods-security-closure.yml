name: InstaPods security closure

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-security-closure.yml

permissions:
  contents: read

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Patch hosted MCP identity handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/codex_plugin_scanner/guard/runtime/mcp_protection.py',
              '''def mcp_server_identity_metadata(identity: McpServerIdentity) -> dict[str, object]:\n    """Serialize an MCP server identity into non-secret Guard metadata."""\n\n    return {\n        "config_path": identity.config_path,\n        "command": identity.command,\n''',
              '''def _non_secret_mcp_server_command(command: str) -> str:\n    """Return a serialization-safe MCP command without URL credentials."""\n\n    if "://" not in command:\n        return command\n    return _sanitize_package_url(command)\n\n\ndef mcp_server_identity_metadata(identity: McpServerIdentity) -> dict[str, object]:\n    """Serialize an MCP server identity into non-secret Guard metadata."""\n\n    return {\n        "config_path": identity.config_path,\n        "command": _non_secret_mcp_server_command(identity.command),\n''',
          )

          replace(
              'src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py',
              '''    remote_url = normalized_remote_mcp_url(launch.get("url"))\n    if remote_url is None:\n        return False\n    identity_command = normalized_remote_mcp_url(_mcp_identity_command(artifact))\n    if identity_command is not None:\n        return identity_command == remote_url\n    server_name = normalized_remote_server_name(_mcp_server_name(artifact))\n''',
              '''    remote_url = normalized_remote_mcp_url(launch.get("url"))\n    if remote_url is None:\n        return False\n    remote_endpoint = remote_url.partition("?")[0]\n    identity_command_value = _mcp_identity_command(artifact)\n    if identity_command_value is not None:\n        identity_command = normalized_remote_mcp_url(identity_command_value)\n        if identity_command is None:\n            return False\n        return identity_command.partition("?")[0] == remote_endpoint\n    server_name = normalized_remote_server_name(_mcp_server_name(artifact))\n''',
          )

          replace(
              'tests/test_guard_remote_mcp_contributions.py',
              '''from codex_plugin_scanner.guard.runtime.mcp_protection import build_mcp_server_identity\n''',
              '''from codex_plugin_scanner.guard.runtime.mcp_protection import (\n    build_mcp_server_identity,\n    mcp_server_identity_metadata,\n)\n''',
          )
          replace(
              'tests/test_guard_remote_mcp_contributions.py',
              '''    with pytest.raises(ValueError, match=r"public HTTPS endpoint"):\n''',
              '''    with pytest.raises(ValueError, match=r"schema|public HTTPS endpoint"):\n''',
          )

          tests = Path('tests/test_guard_remote_mcp_contributions.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''\ndef test_remote_http_contribution_rejects_allow_default() -> None:\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected remote allow-default test marker exactly once')
          additions = '''\n\ndef test_copilot_remote_identity_redacts_query_credentials_and_still_matches(tmp_path: Path) -> None:\n    secret = "runtime-secret"\n    server = _CopilotMcpRuntimeServer(\n        server_name="instapods",\n        source_scope="project",\n        config_path=str(tmp_path / ".mcp.json"),\n        server_config={"url": f"https://app.instapods.com/api/mcp?token={secret}"},\n    )\n    identity, fingerprint, transport = _copilot_runtime_server_identity(server, launch_cwd=tmp_path)\n    serialized_identity = mcp_server_identity_metadata(identity)\n    assert serialized_identity["command"] == "https://app.instapods.com/api/mcp"\n    assert secret not in str(serialized_identity)\n    artifact = build_tool_call_artifact(\n        harness="copilot",\n        server_name="instapods",\n        tool_name="delete_pod",\n        source_scope="project",\n        config_path=server.config_path,\n        transport=transport,\n        server_fingerprint=fingerprint,\n        server_identity=identity,\n    )\n    assert secret not in str(artifact.to_dict())\n    payload = matching_mcp_contribution(artifact)\n    assert payload is not None\n    assert payload["id"] == "mcp.instapods"\n\n\ndef test_invalid_remote_endpoint_does_not_fall_back_to_server_name(tmp_path: Path) -> None:\n    server = _CopilotMcpRuntimeServer(\n        server_name="instapods",\n        source_scope="project",\n        config_path=str(tmp_path / ".mcp.json"),\n        server_config={"url": "http://app.instapods.com/api/mcp"},\n    )\n    identity, fingerprint, transport = _copilot_runtime_server_identity(server, launch_cwd=tmp_path)\n    assert identity.command == "<unresolved>"\n    artifact = build_tool_call_artifact(\n        harness="copilot",\n        server_name="instapods",\n        tool_name="delete_pod",\n        source_scope="project",\n        config_path=server.config_path,\n        transport=transport,\n        server_fingerprint=fingerprint,\n        server_identity=identity,\n    )\n    assert matching_mcp_contribution(artifact) is None\n'''
          tests.write_text(text.replace(marker, additions + marker, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra cisco
      - name: Run focused validation
        id: validation
        shell: bash
        run: |
          set +e
          uv run --no-sync ruff check --fix \
            src/codex_plugin_scanner/guard/runtime/mcp_protection.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            tests/test_guard_remote_mcp_contributions.py 2>&1 | tee instapods-security-ruff.txt
          ruff_status=${PIPESTATUS[0]}
          uv run --no-sync pytest -q tests/test_guard_remote_mcp_contributions.py 2>&1 | tee instapods-security-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'ruff_status=%s\npytest_status=%s\n' "$ruff_status" "$pytest_status" > instapods-security-status.txt
          if [ "$ruff_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instapods-security-validation
          path: |
            instapods-security-ruff.txt
            instapods-security-pytest.txt
            instapods-security-status.txt
      - name: Commit security fixes
        if: always() && steps.validation.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/zz-instapods-security-closure.yml
          git add \
            src/codex_plugin_scanner/guard/runtime/mcp_protection.py \
            src/codex_plugin_scanner/guard/runtime/mcp_server_grants.py \
            tests/test_guard_remote_mcp_contributions.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect hosted MCP endpoint identity'
          git push origin HEAD:codex/instapods-remote-mcp-extension
