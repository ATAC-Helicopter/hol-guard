name: InstaPods decision diff refresh

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-decision-diff.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --python "3.13"
      - run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Commit generated fixture
        shell: bash
        run: |
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh command decision evidence'
          git push origin HEAD:codex/instapods-remote-mcp-extension
