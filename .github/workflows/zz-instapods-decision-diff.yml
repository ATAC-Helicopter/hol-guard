name: InstaPods decision evidence refresh

on:
  push:
    branches:
      - codex/instapods-remote-mcp-extension
    paths:
      - .github/workflows/zz-instapods-decision-diff.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/instapods-remote-mcp-extension
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra cisco
      - name: Regenerate source-bound decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Verify focused hosted MCP tests
        run: uv run --no-sync pytest -q tests/test_guard_remote_mcp_contributions.py tests/test_guard_desktop_contract.py
      - name: Commit regenerated evidence
        shell: bash
        run: |
          git rm .github/workflows/zz-instapods-decision-diff.yml
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh hosted MCP decision evidence'
          git push origin HEAD:codex/instapods-remote-mcp-extension
